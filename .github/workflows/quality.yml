name: quality

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: pnpm quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: challenge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/challenge?schema=public
      KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: docker compose up -d kafka --wait
      # Cria o topico interno de offsets antes dos testes; em broker novo o coordenador de grupos demora a existir.
      - run: docker compose exec -T kafka kafka-console-consumer --bootstrap-server localhost:9092 --topic warmup --group warmup --timeout-ms 8000 || true
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm quality
